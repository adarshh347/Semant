<svg id="g-atlas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Three prints pegged on a wire, each holding a different mark, one carrying the kept mark.">
  <title>Semant — Atlas</title>
  <desc>Three prints pegged on a wire, each holding a different mark, one carrying the kept mark.</desc>
  <style>#g-atlas{color:#1E1A1C}</style>
  <defs>
    <filter id="atlas-bA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="atlas-bB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
    <path d="M2.4 26.6 V29.2"/><path d="M2.4 29.2 H5"/>
    <path d="M29.6 26.6 V29.2"/><path d="M29.6 29.2 H27"/>
  </g>
  <g style="opacity:var(--wash-o, 0.18)">
    <path filter="url(#atlas-bA)" fill="#4E5586"
          d="M2.4 8.6 C10 6.8 22 8 30 7.2 C30.4 11 28.4 13.4 21.4 14.2 C12.6 15.2 2.8 13.8 2.4 11 Z"/>
    <path filter="url(#atlas-bB)" fill="#A66273"
          d="M19.6 16.4 C24 15 29.4 16.2 30.4 18.8 C29.8 22.4 25.4 24.4 21.4 23 C18.4 22 18 17.8 19.6 16.4 Z"/>
  </g>
  <!-- the wire -->
  <path d="M2.4 8.4 C10 7.4 22 9.2 29.6 7.8"
        fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  <!-- pegs -->
  <g fill="none" stroke="#6B5A66" stroke-width="1.3" stroke-linecap="round">
    <path d="M7.2 8 V10.8"/><path d="M15.6 8.6 V11.2"/><path d="M24.4 9.2 V12"/>
  </g>
  <!-- three prints, hung at different depths -->
  <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.4 10.8 C6.4 10.4 9.4 10.8 10.4 10.6 C10.8 13.6 10.4 17.4 10.6 19.4 C8.4 19.8 6.2 19.4 4.6 19.6 C4.2 16.6 4.7 12.6 4.4 10.8 Z"/>
    <path d="M12.6 11.2 C14.8 10.8 18.4 11.2 19.6 11 C20 15 19.6 20.4 19.8 23 C17.4 23.4 14.6 23 12.8 23.2 C12.4 19.2 12.9 13.2 12.6 11.2 Z"/>
    <path d="M21.6 12 C23.6 11.6 26.6 12 27.6 11.8 C28 14.4 27.6 17.6 27.8 19.2 C25.6 19.6 23.4 19.2 21.8 19.4 C21.4 16.8 21.9 13.6 21.6 12 Z"/>
  </g>
  <!-- what each print is holding -->
  <g stroke="#6B5A66" fill="none" stroke-width="1.3" stroke-linecap="round">
    <path d="M6.2 16.4 C7 14.4 8.4 16 9.2 14"/>
    <path d="M23.4 16.6 C24.4 15.4 25.6 16.2 26.4 15.2"/>
  </g>
  <circle cx="6.6" cy="13.2" r="0.85" fill="#6B5A66"/>
  <circle cx="25.8" cy="17.4" r="0.7" fill="#6B5A66"/>
  <!-- the kept mark, held across the set -->
  <circle cx="15.6" cy="17.4" r="2.2" fill="currentColor"/>
  <path d="M17.2 15.9 C18.6 14.5 19.8 13.4 21.2 12.1"
        fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="1.9" stroke-linecap="round"/>
</svg>
