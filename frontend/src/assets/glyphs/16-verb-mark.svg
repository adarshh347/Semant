<svg id="g-verb-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="A pen nib laying down one deliberate stroke.">
  <title>Semant — Mark</title>
  <desc>A pen nib laying down one deliberate stroke.</desc>
  <style>
    #g-verb-mark{color:#1E1A1C}
    #g-verb-mark .gest{stroke-dasharray:100}
    @media (prefers-reduced-motion: no-preference){
      #g-verb-mark:hover .gest, #g-verb-mark:focus-within .gest, #g-verb-mark.play .gest{ animation:mark-draw .72s cubic-bezier(.55,.05,.25,1) }
      #g-verb-mark:hover .late, #g-verb-mark:focus-within .late, #g-verb-mark.play .late{ animation:mark-land .42s ease-out .42s backwards }
      @keyframes mark-draw{ from{stroke-dashoffset:100} to{stroke-dashoffset:0} }
      @keyframes mark-land{ from{opacity:0} to{opacity:1} }
    }
  </style>
  <defs>
    <filter id="mark-bA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="mark-bB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
    <path d="M2 3.6 V6.2"/><path d="M2 3.6 H4.6"/>
    <path d="M30 28.4 V25.8"/><path d="M30 28.4 H27.4"/>
  </g>
  <g style="opacity:var(--wash-o, 0.18)">
    <path filter="url(#mark-bA)" fill="#8E3F6A"
          d="M6.4 4.6 C10.6 3.2 15 4.6 15.8 7.8 C15.4 12 11 14.6 7.6 13.2 C4.6 12 4.6 6.4 6.4 4.6 Z"/>
    <path filter="url(#mark-bB)" fill="#A66273"
          d="M12.4 15.4 C18.6 14.6 26.4 17.4 29.4 21.4 C29.2 25 25.4 26.8 20.4 25.4 C15 23.9 11 19 12.4 15.4 Z"/>
  </g>
  <!-- the nib -->
  <path d="M9.2 4.4 C11.6 5.6 13.2 8.4 13.8 11.8 C12.6 12.8 10.2 12.6 8.8 11.6 C8 8.8 8.2 6 9.2 4.4 Z"
        fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M11 6.2 C11.4 8 11.6 9.9 11.4 11.6"
        fill="none" stroke="#6B5A66" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="11.3" cy="9.4" r="0.85" fill="none" stroke="#6B5A66" stroke-width="1.1"/>
  <!-- the stroke it lays -->
  <path class="gest" pathLength="100"
        d="M11.5 12.6 C13.8 16.6 18.4 19.8 23.8 21.6"
        fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
  <g class="late">
    <circle cx="25.6" cy="22.2" r="2.15" fill="currentColor"/>
    <path d="M27.2 20.7 C28.1 19.8 28.7 19.2 29.4 18.5"
          fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="1.9" stroke-linecap="round"/>
  </g>
</svg>
