<svg id="g-stateful-lineage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="A needle and thread running a stitch through three stacked sheets.">
  <title>Semant — Stateful Lineage</title>
  <desc>A needle and thread running a stitch through three stacked sheets.</desc>
  <style>#g-stateful-lineage{color:#1E1A1C}</style>
  <defs>
    <filter id="stateful-lineage-bA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="stateful-lineage-bB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

    <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
      <path d="M2.6 3.4 V6"/><path d="M2.6 3.4 H5.2"/>
      <path d="M29.4 29 V26.4"/><path d="M29.4 29 H26.8"/>
    </g>
    <g style="opacity:var(--wash-o, 0.18)">
      <path filter="url(#stateful-lineage-bA)" fill="#4E5586"
            d="M2.6 10.4 C10 8.6 22 9.8 30 9.0 C30.4 12.6 28.4 15.0 21.4 15.8 C12.6 16.8 3.0 15.4 2.6 12.8 Z"/>
      <path filter="url(#stateful-lineage-bB)" fill="#A66273"
            d="M17.4 20.6 C23 19.2 29.4 20.4 30.4 22.8 C29.6 26.4 24.4 28.4 19.4 27.0 C15.6 25.9 15.6 22.0 17.4 20.6 Z"/>
    </g>
    <!-- three sheets, seen edge-on -->
    <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M3.6 11.4 C10 10.7 22 11.6 28.6 10.9"/>
      <path d="M3.8 17.4 C10.2 16.7 22.2 17.6 28.8 16.9"/>
      <path d="M4.0 23.4 C10.4 22.7 22.4 23.6 29.0 22.9"/>
    </g>
    <!-- running stitch, over and under -->
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M7.4 8.6 C8.6 10.2 9.6 11.6 10.8 13.2"/>
      <path d="M13.0 15.0 C14.2 16.4 15.2 17.6 16.4 19.0"/>
      <path d="M18.6 20.8 C19.8 22.2 20.8 23.4 22.0 24.8"/>
    </g>
    <!-- the needle eye -->
    <circle cx="6.2" cy="7.2" r="1.05" fill="none" stroke="#6B5A66" stroke-width="1.3"/>
    <!-- origin mark and the same mark, later -->
    <circle cx="6.9" cy="9.0" r="1.5" fill="currentColor" opacity=".55"/>
    <circle cx="23.6" cy="26.4" r="2.05" fill="currentColor"/>
    <path d="M25.1 25.0 C26.3 23.9 27.0 23.2 27.8 22.4"
          fill="none" stroke="var(--tick,#7B2D6B)" stroke-width="1.9" stroke-linecap="round"/>
</svg>
