<svg id="g-form-phone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="A handset, holding the Semant mark on its screen.">
  <title>Semant — Form: Phone</title>
  <desc>A handset, holding the Semant mark on its screen.</desc>
  <style>#g-form-phone{color:#1E1A1C}</style>
  <defs>
    <filter id="phone-bA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="phone-bB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
    <path d="M4.6 6.4 V25.6"/><path d="M27.4 6.4 V25.6"/>
  </g>
  <g style="opacity:var(--wash-o, 0.18)">
    <path filter="url(#phone-bA)" fill="#A66273"
          d="M7.4 5.6 C13 3.6 21 4.6 24.6 7 C24.8 11.4 21.4 14.4 16 14.6 C10 14.8 6.4 10.4 7.4 5.6 Z"/>
    <path filter="url(#phone-bB)" fill="#8E82A0"
          d="M6.6 18.4 C12 16.6 21 17.8 25.4 20.2 C25.6 24.4 21.4 27.6 15.4 27.4 C9.4 27.2 5.6 23.2 6.6 18.4 Z"/>
  </g>
  <!-- the handset -->
  <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.6 3.8 C14.4 3.4 18 3.8 20.4 3.6 C21.8 3.7 22.5 4.6 22.4 6"/>
    <path d="M22.4 6.2 C22.9 12 22.2 21 22.6 26.2"/>
    <path d="M22.6 26.4 C22.7 27.8 21.9 28.5 20.4 28.4 C18 28.2 14.4 28.6 11.6 28.2"/>
    <path d="M11.4 28.2 C10 28.3 9.3 27.5 9.4 26.1 C9.8 20.8 9.1 12 9.5 6.1 C9.4 4.7 10.2 3.9 11.6 3.9"/>
  </g>
  <!-- earpiece and home rule -->
  <g fill="none" stroke="#6B5A66" stroke-width="1.3" stroke-linecap="round">
    <path d="M14.2 6.6 C15.6 6.4 16.8 6.5 17.8 6.4"/>
    <path d="M13.4 25.8 C15.2 25.6 17 25.7 18.6 25.6"/>
  </g>
  <!-- the same mark, inside this door -->
  <circle cx="14.6" cy="17.4" r="2.25" fill="currentColor"/>
  <path d="M16.2 15.8 C17.4 14.6 18.4 13.6 19.6 12.4"
        fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="1.9" stroke-linecap="round"/>
</svg>
