<svg id="g-verb-compose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Two torn scraps brought together inside registration corners.">
  <title>Semant — Compose</title>
  <desc>Two torn scraps brought together inside registration corners.</desc>
  <style>
    #g-verb-compose{color:#1E1A1C}
    @media (prefers-reduced-motion: no-preference){
      #g-verb-compose:hover .gA, #g-verb-compose:focus-within .gA, #g-verb-compose.play .gA{ animation:comp-a .68s cubic-bezier(.34,.02,.2,1) }
      #g-verb-compose:hover .gB, #g-verb-compose:focus-within .gB, #g-verb-compose.play .gB{ animation:comp-b .68s cubic-bezier(.34,.02,.2,1) }
      #g-verb-compose:hover .late, #g-verb-compose:focus-within .late, #g-verb-compose.play .late{ animation:comp-land .4s ease-out .46s backwards }
      @keyframes comp-a{ from{transform:translate(-2.4px,1.2px)} to{transform:none} }
      @keyframes comp-b{ from{transform:translate(2.6px,1.6px)} to{transform:none} }
      @keyframes comp-land{ from{opacity:0} to{opacity:1} }
    }
  </style>
  <defs>
    <filter id="compose-bA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="compose-bB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
    <path d="M16.1 3.4 V28.6"/>
  </g>
  <g style="opacity:var(--wash-o, 0.18)">
    <path filter="url(#compose-bA)" fill="#8E82A0"
          d="M6.4 11.6 C11 10.2 16 11.4 17.4 14.4 C16.8 18.4 12.4 20.6 8.4 19.4 C5 18.4 4.6 13.4 6.4 11.6 Z"/>
    <path filter="url(#compose-bB)" fill="#4E5586"
          d="M16.4 14.6 C21 13.2 26.4 14.4 27.6 17.4 C27 21.6 22.4 24 18.4 22.6 C15 21.5 14.6 16.4 16.4 14.6 Z"/>
  </g>
  <!-- registration corners -->
  <g fill="none" stroke="#6B5A66" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.4 11.4 C4.1 9.4 4.5 7.8 4.3 6.8 C6 6.6 7.6 6.9 9 6.7"/>
    <path d="M27.8 21.2 C28.1 23.2 27.7 24.8 27.9 25.8 C26.2 26 24.6 25.7 23.2 25.9"/>
  </g>
  <!-- scrap A -->
  <path class="gA" d="M7.8 12.4 C10.2 12 12.8 12.6 14.6 12.2 C14.9 14.2 14.5 16.2 14.7 17.4 C12.6 17.8 9.8 17.3 8 17.7 C7.6 15.8 8 14 7.8 12.4 Z"
        fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- scrap B -->
  <path class="gB" d="M17.4 15.2 C19.6 14.8 22.4 15.4 24.2 15 C24.5 17 24.1 19.2 24.3 20.4 C22.2 20.8 19.4 20.3 17.6 20.7 C17.2 18.8 17.6 16.6 17.4 15.2 Z"
        fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the join -->
  <g class="late">
    <circle cx="15.9" cy="16.6" r="2.15" fill="currentColor"/>
    <path d="M17.5 15.1 C18.5 14.1 19.2 13.4 20 12.6"
          fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="1.9" stroke-linecap="round"/>
  </g>
</svg>
