<svg id="g-form-desktop" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="An open laptop, holding the Semant mark on its screen.">
  <title>Semant — Form: Desktop</title>
  <desc>An open laptop, holding the Semant mark on its screen.</desc>
  <style>#g-form-desktop{color:#1E1A1C}</style>
  <defs>
    <filter id="desktop-bA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="desktop-bB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
    <path d="M16.1 2.4 V29"/>
    <path d="M1.8 5.4 V8"/><path d="M1.8 5.4 H4.4"/>
  </g>
  <g style="opacity:var(--wash-o, 0.18)">
    <path filter="url(#desktop-bA)" fill="#4E5586"
          d="M6.4 5.6 C13 4 22 4.8 26.6 6.8 C26.8 10.6 23.4 13.4 16.4 13.6 C9 13.8 5.4 10 6.4 5.6 Z"/>
    <path filter="url(#desktop-bB)" fill="#8E82A0"
          d="M2.4 19.6 C10 18 23 19.2 30 21.4 C30.2 24.4 24.4 26.4 16 26.2 C7 26 1.4 23.4 2.4 19.6 Z"/>
  </g>
  <!-- the screen -->
  <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.6 5.6 C11.6 4.9 21 5.7 26.4 5.1"/>
    <path d="M26.3 5.2 C26.8 9.4 26.1 14.4 26.5 18.4"/>
    <path d="M26.4 18.6 C21 19.3 11.6 18.5 5.6 19.1"/>
    <path d="M5.9 18.9 C5.3 14.6 6 9.4 5.5 5.3"/>
  </g>
  <!-- the deck -->
  <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.2 19.2 C5.9 20 4.9 21.2 3.2 21.9"/>
    <path d="M25.8 19.2 C26.3 20 27.5 21.2 28.9 21.7"/>
    <path d="M3.1 22.1 C10 21.1 22 22.3 28.9 21.4"/>
  </g>
  <path d="M13.8 21.5 C15 21.9 16.8 21.8 18.2 21.4"
        fill="none" stroke="#6B5A66" stroke-width="1.3" stroke-linecap="round"/>
  <!-- the same mark, inside this door -->
  <circle cx="14.6" cy="12.6" r="2.25" fill="currentColor"/>
  <path d="M16.2 11 C17.7 9.5 18.8 8.4 20.2 7"
        fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="1.9" stroke-linecap="round"/>
</svg>
