<svg id="g-operation-grammar" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="A hand stamp above a surface, and the mark it has left.">
  <title>Semant — Operation Grammar</title>
  <desc>A hand stamp above a surface, and the mark it has left.</desc>
  <style>#g-operation-grammar{color:#1E1A1C}</style>
  <defs>
    <filter id="operation-grammar-bA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="operation-grammar-bB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

    <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
      <path d="M16.1 2.4 V13"/>
      <path d="M7.4 12.6 V16.2" stroke-dasharray="1.4 2"/>
      <path d="M24.8 12.6 V16.2" stroke-dasharray="1.4 2"/>
    </g>
    <g style="opacity:var(--wash-o, 0.18)">
      <path filter="url(#operation-grammar-bA)" fill="#8E3F6A"
            d="M8.6 9.6 C13.6 7.8 19.4 8.4 23.4 10.4 C23.8 14.2 20.4 16.4 15.6 16.4 C10.6 16.4 7.4 13.6 8.6 9.6 Z"/>
      <path filter="url(#operation-grammar-bB)" fill="#8E82A0"
            d="M3.4 20.6 C10.4 19.2 22 20.2 29.0 22.0 C29.2 25.4 24.4 27.6 16.0 27.4 C7.6 27.2 2.4 24.4 3.4 20.6 Z"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <!-- handle -->
      <path d="M12.8 6.4 C13.6 4.4 18.4 4.3 19.4 6.3"/>
      <path d="M12.9 6.6 C12.7 8.0 13.2 8.8 14.0 9.3"/>
      <path d="M19.3 6.6 C19.5 8.0 19.0 8.8 18.2 9.3"/>
      <!-- the die -->
      <path d="M9.6 10.2 C13.8 9.5 18.4 9.7 22.4 10.4"/>
      <path d="M22.4 10.6 C22.7 12.2 22.4 13.6 22.1 14.6"/>
      <path d="M22.2 14.8 C18.2 15.5 13.6 15.3 9.7 14.6"/>
      <path d="M9.8 14.8 C9.4 13.4 9.4 11.6 9.6 10.3"/>
      <!-- the surface being stamped -->
      <path d="M3.6 22.4 C10.4 21.6 21.2 22.6 28.6 21.8"/>
    </g>
    <!-- the impression -->
    <circle cx="14.8" cy="20.6" r="2.15" fill="currentColor"/>
    <path d="M16.4 19.1 C17.9 17.6 18.9 16.6 20.2 15.3"
          fill="none" stroke="var(--tick,#7B2D6B)" stroke-width="1.9" stroke-linecap="round"/>
    <!-- an act that did not run -->
    <path d="M24.4 20.2 C25.4 20.1 26.0 20.2 26.6 20.1"
          fill="none" stroke="#6B5A66" stroke-width="1.4" stroke-linecap="round" opacity=".65"/>
</svg>
