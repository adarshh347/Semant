<svg id="g-manuscript" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="A written page whose citation chip stays tethered to a mark outside the text.">
  <title>Semant — Manuscript</title>
  <desc>A written page whose citation chip stays tethered to a mark outside the text.</desc>
  <style>#g-manuscript{color:#1E1A1C}</style>
  <defs>
    <filter id="manuscript-bA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="manuscript-bB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
    <path d="M2.2 3.4 V6"/><path d="M2.2 3.4 H4.8"/>
    <path d="M6.4 4.6 V27"/>
  </g>
  <g style="opacity:var(--wash-o, 0.18)">
    <path filter="url(#manuscript-bA)" fill="#8E82A0"
          d="M4.4 6 C9.6 4.4 17.6 5.2 20.8 7.4 C21 12.4 18.4 15.6 12.6 15.8 C6.6 16 3 10.4 4.4 6 Z"/>
    <path filter="url(#manuscript-bB)" fill="#8E3F6A"
          d="M19.4 19.4 C23.6 17.8 29.4 19.2 30.4 22 C29.8 25.6 25.4 27.8 21.4 26.4 C18.4 25.4 17.8 21 19.4 19.4 Z"/>
  </g>
  <!-- the page -->
  <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.2 4.6 C8.6 3.9 16.6 4.7 21.4 4.1"/>
    <path d="M21.3 4.2 C21.8 10 21.1 19.6 21.5 26.6"/>
    <path d="M21.4 26.8 C16.6 27.5 8.6 26.7 4.2 27.3"/>
    <path d="M4.5 27.1 C3.9 20.4 4.6 11 4.1 4.3"/>
  </g>
  <!-- ruled writing -->
  <g fill="none" stroke="#6B5A66" stroke-width="1.3" stroke-linecap="round">
    <path d="M7 8.6 C10.6 8.2 15.4 8.9 18.8 8.4"/>
    <path d="M7.1 20.4 C10.7 20 15.5 20.7 18.9 20.2"/>
    <path d="M7.2 23.8 C10 23.5 12.8 23.9 15.2 23.6"/>
  </g>
  <!-- the citation chip, interrupting the line -->
  <path d="M9.4 12.4 C12.4 11.9 16.2 12.3 18.4 12.2 C18.9 13.4 18.8 15 18.3 16 C15.8 16.5 12 16.1 9.4 16.2 C8.8 15 8.9 13.4 9.4 12.4 Z"
        fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M7.1 14.3 C7.8 14.2 8.4 14.3 8.9 14.2"
        fill="none" stroke="#6B5A66" stroke-width="1.3" stroke-linecap="round"/>
  <!-- the tether: evidence stays attached, outside the text -->
  <path d="M18.6 15.4 C20.6 16.6 21.6 18.4 23.2 20.4"
        fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="25.2" cy="22.4" r="2.15" fill="currentColor"/>
  <path d="M26.8 21 C27.8 20 28.5 19.3 29.3 18.5"
        fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="1.9" stroke-linecap="round"/>
</svg>
