<svg id="g-perceptual-state" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="A photographic print with a folded corner; one feature inside it carries a mark.">
  <title>Semant — Perceptual State</title>
  <desc>A photographic print with a folded corner; one feature inside it carries a mark.</desc>
  <style>#g-perceptual-state{color:#1E1A1C}</style>
  <defs>
    <filter id="perceptual-state-bA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="perceptual-state-bB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

    <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
      <path d="M2.6 4.4 V7"/><path d="M2.6 4.4 H5.2"/>
      <path d="M29.4 29 V26.4"/><path d="M29.4 29 H26.8"/>
    </g>
    <g style="opacity:var(--wash-o, 0.18)">
      <path filter="url(#perceptual-state-bA)" fill="#6B5391"
            d="M6.6 8.2 C12 6.6 18.6 7.4 22.6 9.6 C22.8 13.6 19.4 16.4 13.6 16.6 C8.2 16.8 5.2 12.6 6.6 8.2 Z"/>
      <path filter="url(#perceptual-state-bB)" fill="#A66273"
            d="M5.4 17.6 C11 16.2 19.4 17.4 24.4 19.4 C24.6 23.4 20.6 26.4 14.4 26.2 C8.6 26.0 4.4 22.4 5.4 17.6 Z"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.2 8.6 C9.4 7.9 13.6 8.5 17.4 7.9"/>
      <path d="M17.5 8.0 C19.2 9.9 20.8 11.4 22.6 12.6"/>
      <path d="M22.5 12.8 C22.9 17.2 22.2 21.4 22.6 24.7"/>
      <path d="M22.4 24.9 C17.6 25.6 10.4 24.8 5.3 25.4"/>
      <path d="M5.6 25.2 C5.0 20.4 5.7 13.6 5.1 8.2"/>
    </g>
    <!-- the fold -->
    <path d="M17.5 8.2 C17.9 10.6 19.6 12.3 22.4 12.8"
          fill="none" stroke="#6B5A66" stroke-width="1.3" stroke-linecap="round"/>
    <!-- what the print is a picture of -->
    <circle cx="9.8" cy="12.6" r="1.9" fill="none" stroke="#6B5A66" stroke-width="1.3"/>
    <path d="M6.8 20.8 C9.8 17.4 12.6 19.6 15.4 16.8 C17.2 15.0 19.4 15.8 21.2 15.0"
          fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <!-- the addressed feature -->
    <circle cx="14.6" cy="18.0" r="2.15" fill="currentColor"/>
    <path d="M16.2 19.5 C17.7 21.0 18.7 22.0 20.0 23.4"
          fill="none" stroke="var(--tick,#7B2D6B)" stroke-width="1.9" stroke-linecap="round"/>
</svg>
