<svg id="g-differential" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="A print divided by uneven perceptual cuts, with a loupe resting on it.">
  <title>Semant — Differential</title>
  <desc>A print divided by uneven perceptual cuts, with a loupe resting on it.</desc>
  <style>#g-differential{color:#1E1A1C}</style>
  <defs>
    <filter id="differential-bA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="differential-bB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
    <path d="M2.4 4 V6.6"/><path d="M2.4 4 H5"/>
    <path d="M13.6 3.2 V28.4"/>
  </g>
  <g style="opacity:var(--wash-o, 0.18)">
    <path filter="url(#differential-bA)" fill="#6B5391"
          d="M4.4 7.6 C9.6 6 16.6 6.8 20.6 9 C20.8 13 17.2 15.8 11.4 16 C6 16.2 3 12 4.4 7.6 Z"/>
    <path filter="url(#differential-bB)" fill="#A66273"
          d="M17.4 16.4 C21.6 14.8 27.6 16.2 28.8 19.4 C29.4 23.6 25 26.8 20.6 25.6 C16.6 24.5 15.6 18.8 17.4 16.4 Z"/>
  </g>
  <!-- the print -->
  <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.6 7 C8.6 6.3 17.6 7.1 23.4 6.5"/>
    <path d="M23.3 6.6 C23.8 12 23.1 19.4 23.5 24.6"/>
    <path d="M23.4 24.8 C17.6 25.5 8.6 24.7 3.6 25.3"/>
    <path d="M3.9 25.1 C3.3 19.6 4 12 3.5 6.7"/>
  </g>
  <!-- uneven perceptual divisions, not bounding boxes -->
  <g fill="none" stroke="#6B5A66" stroke-width="1.3" stroke-linecap="round">
    <path d="M11.6 6.8 C10.6 11.6 13 16.4 10.4 25"/>
    <path d="M3.8 17.4 C8.4 16.2 15 18.4 23.2 16.6"/>
  </g>
  <!-- inspected evidence -->
  <circle cx="7.4" cy="12.2" r="1.05" fill="currentColor" opacity=".55"/>
  <circle cx="17.2" cy="21.6" r="1.05" fill="currentColor" opacity=".55"/>
  <!-- the loupe -->
  <circle cx="21.6" cy="19.8" r="5.3" fill="none" stroke="currentColor" stroke-width="1.9"/>
  <path d="M25.4 23.6 C26.8 25 27.8 26 29 27.2"
        fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
  <circle cx="21.4" cy="19.9" r="2.15" fill="currentColor"/>
  <path d="M23 18.4 C23.9 17.5 24.4 17 25 16.4"
        fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="1.9" stroke-linecap="round"/>
</svg>
