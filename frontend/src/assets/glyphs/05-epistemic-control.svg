<svg id="g-epistemic-control" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="A bell jar over an unresolved specimen, with two opposed strokes below.">
  <title>Semant — Epistemic Control</title>
  <desc>A bell jar over an unresolved specimen, with two opposed strokes below.</desc>
  <style>#g-epistemic-control{color:#1E1A1C}</style>
  <defs>
    <filter id="epistemic-control-bA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="epistemic-control-bB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

    <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
      <path d="M15.4 2.2 V19"/>
      <path d="M29.4 29.2 V26.6"/><path d="M29.4 29.2 H26.8"/>
    </g>
    <g style="opacity:var(--wash-o, 0.18)">
      <path filter="url(#epistemic-control-bA)" fill="#8E82A0"
            d="M9.4 8.6 C12.4 5.4 18.6 5.6 21.4 8.8 C22.4 13.0 20.4 16.4 15.6 16.6 C10.6 16.8 8.4 12.8 9.4 8.6 Z"/>
      <path filter="url(#epistemic-control-bB)" fill="#8E3F6A"
            d="M3.4 21.4 C10 20.0 20 21.2 27.6 23.0 C27.8 26.4 22.6 28.6 14.4 28.2 C6.6 27.8 2.4 25.0 3.4 21.4 Z"/>
    </g>
    <!-- the jar -->
    <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.0 17.6 C8.4 11.2 11.6 6.6 15.4 6.6 C19.2 6.6 22.4 11.2 21.8 17.6"/>
      <path d="M7.8 18.2 C11.4 18.9 19.4 17.9 23.0 18.6"/>
    </g>
    <circle cx="15.4" cy="5.2" r="1.05" fill="none" stroke="#6B5A66" stroke-width="1.3"/>
    <!-- the held-open, unresolved reading -->
    <circle cx="15.3" cy="12.6" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"
            stroke-dasharray="1.5 2.2" opacity=".7"/>
    <circle cx="15.3" cy="12.6" r="0.85" fill="#6B5A66" opacity=".8"/>
    <!-- two strokes running against each other; neither erases the other -->
    <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M3.8 23.0 C9.6 22.0 17.6 23.6 23.8 22.2"/>
      <path d="M28.0 27.4 C21.4 28.2 13.4 26.6 6.4 27.8"/>
    </g>
    <circle cx="25.6" cy="21.7" r="2.05" fill="currentColor"/>
    <path d="M27.1 20.3 C28.0 19.4 28.6 18.7 29.3 18.0"
          fill="none" stroke="var(--tick,#7B2D6B)" stroke-width="1.9" stroke-linecap="round"/>
</svg>
