<svg id="g-form-cli" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="A terminal window; the prompt caret and a cursor that is the Semant mark.">
  <title>Semant — Form: CLI</title>
  <desc>A terminal window; the prompt caret and a cursor that is the Semant mark.</desc>
  <style>#g-form-cli{color:#1E1A1C}</style>
  <defs>
    <filter id="cli-bA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="cli-bB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
    <path d="M1.8 4 V6.6"/><path d="M1.8 4 H4.4"/>
    <path d="M30.2 28 V25.4"/><path d="M30.2 28 H27.6"/>
  </g>
  <g style="opacity:var(--wash-o, 0.18)">
    <path filter="url(#cli-bA)" fill="#8E3F6A"
          d="M3.4 6.8 C11 5.2 23 6 29.4 8 C29.6 11.4 26.4 13.6 17.4 13.8 C8.4 14 2.4 11.2 3.4 6.8 Z"/>
    <path filter="url(#cli-bB)" fill="#6B5391"
          d="M4.4 17 C12 15.4 24 16.6 30 18.8 C30.2 22.8 25 26 16.4 25.8 C7.6 25.6 3.4 21.8 4.4 17 Z"/>
  </g>
  <!-- the window -->
  <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.4 7.1 C10 6.4 21 7.2 28.6 6.6"/>
    <path d="M28.5 6.7 C29 11 28.3 19.6 28.7 25"/>
    <path d="M28.6 25.2 C21 25.9 10 25.1 3.4 25.7"/>
    <path d="M3.7 25.5 C3.1 20 3.8 11.8 3.3 6.8"/>
  </g>
  <path d="M3.6 11.4 C10.2 10.8 21 11.6 28.4 11"
        fill="none" stroke="#6B5A66" stroke-width="1.3" stroke-linecap="round"/>
  <!-- the prompt -->
  <path d="M7.4 15.2 C8.8 16.4 9.6 17.1 10.6 18.1 C9.6 19.2 8.8 19.9 7.4 21.1"
        fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- an earlier line, already run -->
  <path d="M7.5 23 C10.4 22.7 14.6 23.1 17.4 22.8"
        fill="none" stroke="#6B5A66" stroke-width="1.3" stroke-linecap="round"/>
  <!-- the cursor is the mark -->
  <circle cx="14.4" cy="18.2" r="2.25" fill="currentColor"/>
  <path d="M16 16.6 C17.5 15.1 18.6 14 20 12.6"
        fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="1.9" stroke-linecap="round"/>
</svg>
