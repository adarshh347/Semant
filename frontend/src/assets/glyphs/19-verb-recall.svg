<svg id="g-verb-recall" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="One card lifted clear of a card index.">
  <title>Semant — Recall</title>
  <desc>One card lifted clear of a card index.</desc>
  <style>
    #g-verb-recall{color:#1E1A1C}
    @media (prefers-reduced-motion: no-preference){
      #g-verb-recall:hover .gest, #g-verb-recall:focus-within .gest, #g-verb-recall.play .gest{ animation:recall-lift .7s cubic-bezier(.28,.02,.2,1) }
      @keyframes recall-lift{ from{transform:translateY(4.2px)} to{transform:none} }
    }
  </style>
  <defs>
    <filter id="recall-bA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="recall-bB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
    <path d="M2 5.6 V8.2"/><path d="M2 5.6 H4.6"/>
    <path d="M30 5.6 V8.2"/><path d="M30 5.6 H27.4"/>
  </g>
  <g style="opacity:var(--wash-o, 0.18)">
    <path filter="url(#recall-bA)" fill="#6F5E90"
          d="M3.4 17.6 C11 15.8 23 17 30 19.2 C30.2 23.4 24.4 26.6 16 26.4 C7 26.2 2.4 22.4 3.4 17.6 Z"/>
    <path filter="url(#recall-bB)" fill="#A66273"
          d="M13.4 8.4 C17.6 7 22 8.4 22.8 11.4 C22.4 15.6 18.4 18.4 14.6 17 C11.4 15.8 11.6 10.2 13.4 8.4 Z"/>
  </g>
  <!-- the index -->
  <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 14.6 C3.7 18.8 4.1 23.4 3.9 26.2"/>
    <path d="M4 26.4 C10 27.1 22 26.3 28 27"/>
    <path d="M28.1 26.8 C28.4 22.6 28 18 28.2 15"/>
  </g>
  <g fill="none" stroke="#6B5A66" stroke-width="1.3" stroke-linecap="round">
    <path d="M7.8 16.6 C7.6 20 7.9 23.6 7.7 25.8"/>
    <path d="M11.4 16.2 C11.2 19.8 11.5 23.4 11.3 25.7"/>
    <path d="M22.6 16.4 C22.4 20 22.7 23.6 22.5 25.8"/>
    <path d="M25.8 16.8 C25.6 20.2 25.9 23.6 25.7 25.7"/>
  </g>
  <!-- the card that came back -->
  <g class="gest">
    <path d="M14.6 8.8 C16.4 8.4 18.6 8.8 19.6 8.6 C19.9 13 19.5 19 19.7 23.6 C17.8 24 15.8 23.6 14.7 23.8 C14.3 19 14.8 12.6 14.6 8.8 Z"
          fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15.8 20.4 C16.8 20.2 18 20.4 18.8 20.2"
          fill="none" stroke="#6B5A66" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="16.5" cy="13.6" r="2.05" fill="currentColor"/>
    <path d="M18 12.2 C18.9 11.3 19.4 10.8 20 10.2"
          fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="1.9" stroke-linecap="round"/>
  </g>
</svg>
