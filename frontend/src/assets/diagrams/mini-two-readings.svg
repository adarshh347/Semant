<svg id="d-two-readings" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 40" width="88" height="40" role="img" aria-label="Two readings cross without erasing each other; a third, unresolved, is kept under glass.">
  <title>Semant — Two readings kept</title>
  <desc>Two readings cross without erasing each other; a third, unresolved, is kept under glass.</desc>
  <style>#d-two-readings{color:#1E1A1C}</style>
  <defs>
    <filter id="dtr-b" x="-25%" y="-40%" width="150%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#A9A0A6" stroke-width="0.8" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
    <path d="M29 17 L35 23"/><path d="M35 17 L29 23"/>
  </g>
  <g style="opacity:var(--wash-o, 0.16)">
    <path filter="url(#dtr-b)" fill="#8E3F6A"
          d="M3 9 C16 6.4 38 8 54 10 C55 15 48 19 30 19.6 C13 20.2 2 15 3 9 Z"/>
    <path filter="url(#dtr-b)" fill="#8E82A0"
          d="M60 8 C70 5.6 82 7.6 85 11 C85.6 18 80 23 71 22.6 C62 22.2 58 13 60 8 Z"/>
  </g>
  <!-- the reading -->
  <path d="M4.4 12.4 C14 14.2 26 18.6 40 24"
        fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <!-- the counter-reading -->
  <path d="M42 11.4 C32 14.6 18 20 5.2 26.4"
        fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <!-- kept regardless -->
  <circle cx="16.4" cy="17.2" r="3.4" fill="currentColor"/>
  <path d="M19 14.7 C21 12.7 22.2 11.5 23.8 9.9"
        fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- under glass -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 26.4 C61 17.6 66 10.4 71.6 10.4 C77.2 10.4 82 17.6 81 26.4"/>
    <path d="M60 27.2 C65.4 28.2 77.6 26.8 83 27.8"/>
  </g>
  <circle cx="71.6" cy="8.4" r="1.4" fill="none" stroke="#6B5A66" stroke-width="1.4"/>
  <circle cx="71.5" cy="19.4" r="4" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-dasharray="2.2 3" opacity=".7"/>
  <circle cx="71.5" cy="19.4" r="1.3" fill="#6B5A66" opacity=".8"/>
</svg>
