<svg id="d-ground-types" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 40" width="88" height="40" role="img" aria-label="Four samples laid out in a tray: a blot, a scatter, a stroke and a pair.">
  <title>Semant — Kinds of ground</title>
  <desc>Four samples laid out in a tray: a blot, a scatter, a stroke and a pair.</desc>
  <style>#d-ground-types{color:#1E1A1C}</style>
  <defs>
    <filter id="dgt-b" x="-25%" y="-40%" width="150%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g style="opacity:var(--wash-o, 0.16)">
    <path filter="url(#dgt-b)" fill="#4E5586"
          d="M4 8 C24 5 56 7 84 9 C85 17 76 22 44 23 C14 24 3 16 4 8 Z"/>
    <path filter="url(#dgt-b)" fill="#8E3F6A"
          d="M46 24 C60 21 80 23 85 27 C84 33 72 37 58 35 C48 33.6 44 27 46 24 Z"/>
  </g>
  <!-- the tray -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.4 6.4 C22 5.6 62 6.6 84.6 5.8"/>
    <path d="M84.4 5.9 C85.4 15 84.6 27 85 34.2"/>
    <path d="M84.8 34.4 C62 35.2 22 34.2 3.4 35"/>
    <path d="M3.8 34.8 C2.8 26 3.6 14 3.2 6.2"/>
  </g>
  <g fill="none" stroke="#6B5A66" stroke-width="1.4" stroke-linecap="round" opacity=".7">
    <path d="M23.4 6.2 C22.8 15 23.6 27 23.2 34.6"/>
    <path d="M44.4 6.4 C43.8 15 44.6 27 44.2 34.8"/>
    <path d="M64.4 6.2 C63.8 15 64.6 27 64.2 34.6"/>
  </g>
  <!-- a blot -->
  <path d="M9.6 15.4 C11.6 12.2 17.4 13 18.6 16.6 C19.8 20.6 15.4 24.6 11.8 23 C8.6 21.6 7.8 18 9.6 15.4 Z"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- a scatter -->
  <g fill="currentColor">
    <circle cx="29.4" cy="15.6" r="1.3"/><circle cx="35.4" cy="13.4" r="1.1"/>
    <circle cx="38.6" cy="18.6" r="1.3"/><circle cx="31.6" cy="21.4" r="1"/>
    <circle cx="36.6" cy="23.4" r="1.2"/><circle cx="27.4" cy="20.4" r="0.9"/>
  </g>
  <!-- a stroke -->
  <path d="M48.6 24.6 C52.6 15.6 57.4 21.4 61.6 12.6"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- a pair, carrying the mark -->
  <path d="M69.6 24.4 C72.6 21.6 75.4 19.4 78 17.6"
        fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  <circle cx="68.6" cy="25.2" r="2" fill="currentColor"/>
  <circle cx="79.4" cy="16.6" r="3.4" fill="currentColor"/>
  <path d="M81.6 14 C83 12.4 83.8 11.4 84.8 10.2"
        fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="2.2" stroke-linecap="round"/>
</svg>
