<svg id="s-differential" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" width="200" height="130" role="img" aria-label="A print cut by uneven perceptual divisions, a loupe over one of them, and a rail of inspected evidence beside it.">
  <title>Semant — Differential specimen</title>
  <desc>A print cut by uneven perceptual divisions, a loupe over one of them, and a rail of inspected evidence beside it.</desc>
  <style>#s-differential{color:#1E1A1C}</style>
  <defs>
    <filter id="sd-bA" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sd-bB" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.036" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#A9A0A6" stroke-width="1" stroke-linecap="round" style="opacity:var(--guide-o, 0.15)">
    <path d="M6 6 V16"/><path d="M6 6 H16"/>
    <path d="M194 124 V114"/><path d="M194 124 H184"/>
    <path d="M67 10 V120"/>
  </g>
  <g style="opacity:var(--wash-o, 0.17)">
    <path filter="url(#sd-bA)" fill="#6B5391"
          d="M18 16 C46 8 88 12 112 22 C114 44 96 58 62 60 C28 62 12 42 18 16 Z"/>
    <path filter="url(#sd-bB)" fill="#A66273"
          d="M40 62 C72 52 110 62 122 82 C124 106 100 120 68 118 C36 116 30 82 40 62 Z"/>
    <path filter="url(#sd-bB)" fill="#4E5586"
          d="M136 20 C156 14 186 18 194 28 C194 44 176 52 156 50 C138 48 132 30 136 20 Z"/>
  </g>
  <!-- the print -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 15 C40 13.4 92 15 118 13.6"/>
    <path d="M117.6 13.8 C119.4 40 118 92 119 116"/>
    <path d="M118.6 116.6 C92 118.2 40 116.6 14 118"/>
    <path d="M15 117.4 C13.2 92 14.6 40 13.6 14.2"/>
  </g>
  <!-- uneven perceptual divisions -->
  <g fill="none" stroke="#6B5A66" stroke-width="1.6" stroke-linecap="round">
    <path d="M56 14 C50 34 62 54 46 96 C42 106 40 112 41 117"/>
    <path d="M14.4 66 C36 60 62 72 92 64 C104 61 112 62 118 60"/>
    <path d="M86 15 C88 30 82 42 88 60"/>
  </g>
  <!-- inspected evidence on the print -->
  <g fill="currentColor" opacity=".55">
    <circle cx="34" cy="40" r="2.4"/><circle cx="98" cy="36" r="2.2"/><circle cx="62" cy="98" r="2.2"/>
  </g>
  <!-- the loupe -->
  <circle cx="94" cy="88" r="23" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <path d="M110.6 104.6 C116 110 120 114 125 119"
        fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M78 86 C86 74 96 82 108 72"
        fill="none" stroke="#6B5A66" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
  <circle cx="93.6" cy="88.4" r="4.4" fill="currentColor"/>
  <path d="M96.8 85.2 C100.4 81.6 102.6 79.4 105.6 76.4"
        fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- the evidence rail -->
  <g fill="none" stroke="#6B5A66" stroke-width="1.5" stroke-linecap="round">
    <path d="M134 18 C136 46 134 92 135 114"/>
    <path d="M146 30 C158 28.6 176 30.4 190 29"/>
    <path d="M146 36.6 C154 35.6 164 36.6 172 35.8"/>
    <path d="M146 62 C158 60.6 176 62.4 190 61"/>
    <path d="M146 68.6 C154 67.6 164 68.6 172 67.8"/>
    <path d="M146 94 C158 92.6 176 94.4 190 93"/>
    <path d="M146 100.6 C154 99.6 164 100.6 172 99.8"/>
  </g>
  <g fill="currentColor">
    <circle cx="139" cy="31" r="3.4"/>
    <circle cx="139" cy="63" r="2.4" opacity=".55"/>
    <circle cx="139" cy="95" r="2.4" opacity=".55"/>
  </g>
  <path d="M141.6 28.2 C144 25.6 145.4 24 147.4 21.8"
        fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="2.2" stroke-linecap="round"/>
</svg>
