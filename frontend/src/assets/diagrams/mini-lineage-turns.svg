<svg id="d-lineage-turns" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 40" width="88" height="40" role="img" aria-label="One thread crosses three turns and arrives as the same mark it started as.">
  <title>Semant — Across the turn</title>
  <desc>One thread crosses three turns and arrives as the same mark it started as.</desc>
  <style>#d-lineage-turns{color:#1E1A1C}</style>
  <defs>
    <filter id="dlt-b" x="-25%" y="-40%" width="150%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#A9A0A6" stroke-width="0.9" stroke-linecap="round" style="opacity:var(--guide-o, 0.18)">
    <path d="M27 6 V34" stroke-dasharray="2 3.2"/>
    <path d="M45 6 V34" stroke-dasharray="2 3.2"/>
    <path d="M63 6 V34" stroke-dasharray="2 3.2"/>
  </g>
  <g style="opacity:var(--wash-o, 0.16)">
    <path filter="url(#dlt-b)" fill="#96784F"
          d="M3 14 C22 11 54 13 84 11 C86 18 80 23 56 25 C26 27 2 24 3 19 Z"/>
    <path filter="url(#dlt-b)" fill="#6F5E90"
          d="M60 24 C70 21 84 23 86 27 C85 33 76 37 66 35 C58 33.4 58 26 60 24 Z"/>
  </g>
  <!-- the thread -->
  <path d="M11 20.4 C21 18.6 28 22.2 38 19.8 C46 18 52 21.6 60 19.6 C64 18.6 66 19.4 68 19"
        fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <!-- the same mark, twice -->
  <circle cx="7.4" cy="20.8" r="3.5" fill="currentColor"/>
  <circle cx="71.6" cy="18.8" r="3.5" fill="currentColor"/>
  <path d="M74.2 16.2 C76.2 14.2 77.4 13 79 11.4"
        fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- what the turns are -->
  <g fill="none" stroke="#6B5A66" stroke-width="1.4" stroke-linecap="round" opacity=".6">
    <path d="M15 30 C18 29.6 21 30.2 23 29.8"/>
    <path d="M33 30 C36 29.6 39 30.2 41 29.8"/>
    <path d="M51 30 C54 29.6 57 30.2 59 29.8"/>
  </g>
</svg>
