    <path d="M340 202 C334 201.6 331.6 204 332 208 C332.6 214 332 220 332.4 223 C332.8 226 335 227.6 339 226.8"/>
    <path d="M372 201.6 C378 201.4 380.4 203.6 380 207.6 C379.4 213.6 380 219.6 379.6 222.6 C379.2 225.6 377 227.2 373 226.4"/>
  </g>
  <g fill="none" stroke="#6B5A66" stroke-width="1.5" stroke-linecap="round">
    <path d="M152 212 C166 211 186 213 222 212"/>
    <path d="M256 212 C272 211 296 213 328 212"/>
    <path d="M382 212 C392 211.4 398 212.4 404 211.8"/>
    <path d="M462 212 C480 211 500 213 524 212"/>
    <path d="M528 206 C548 205 574 207 596 206"/>
    <path d="M528 218 C544 217 564 219 582 218"/>
  </g>
  <circle cx="440" cy="211.6" r="7" fill="currentColor"/>
  <path d="M445 206.6 C451 200.6 455 196.6 460 191.6"
        fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="2.4" stroke-linecap="round"/>
  <text class="lo" x="120" y="244">Source</text>
  <text class="lo" x="222" y="244">Region</text>
  <text class="lo" x="326" y="244">Ground</text>
  <text class="lo" x="418" y="244">Percept</text>
  <text class="lo" x="526" y="244">Mention</text>

  <!-- the surfaces that read it -->
  <g fill="none" stroke="#6B5A66" stroke-width="1.5" stroke-linecap="round">
    <path d="M200 252 C202 262 204 268 208 274"/>
    <path d="M360 252 C361 262 359 268 360 274"/>
    <path d="M520 252 C518 262 516 268 512 274"/>
  </g>
  <text x="168" y="290">Differential</text>
  <text x="330" y="290">Manuscript</text>
  <text x="494" y="290">Atlas</text>
</svg>
