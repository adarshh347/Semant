<svg id="x-runtime" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Four kinds of actor work through one bounded runtime onto a single chain of perceptual state, which the three working surfaces read.">
  <title>Semant — The Perceptual Runtime</title>
  <desc>Four kinds of actor work through one bounded runtime onto a single chain of perceptual state, which the three working surfaces read.</desc>
  <style>
    #x-runtime{color:#1E1A1C}
    #x-runtime text{font-family:'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
                    font-size:9px;letter-spacing:.14em;text-transform:uppercase;fill:#6B5A66}
    #x-runtime .lo{fill:#A9A0A6;letter-spacing:.16em}
    #x-runtime .hi{fill:#1E1A1C}
  </style>
  <defs>
    <filter id="xr-bA" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="xr-bB" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g fill="none" stroke="#A9A0A6" stroke-width="1" stroke-linecap="round" style="opacity:var(--guide-o, 0.15)">
    <path d="M10 12 V28"/><path d="M10 12 H26"/>
    <path d="M710 288 V272"/><path d="M710 288 H694"/>
    <path d="M360 8 V292"/>
  </g>
  <g style="opacity:var(--wash-o, 0.15)">
    <path filter="url(#xr-bA)" fill="#6B5391"
          d="M96 78 C240 58 500 66 626 84 C640 122 610 158 400 166 C180 174 82 140 96 78 Z"/>
    <path filter="url(#xr-bB)" fill="#A66273"
          d="M120 196 C260 182 480 190 600 202 C610 224 570 242 380 246 C180 250 110 226 120 196 Z"/>
  </g>

  <!-- the actors -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 22 C112 18 122 20 126 27 C122 34 112 36 104 32 C100 28 100 25 104 22 Z"/>
    <path d="M258 20 C268 18 280 20 284 26 C284 32 278 36 268 35 C258 34 254 26 258 20 Z"/>
    <path d="M420 20 C430 17 442 19 446 26"/>
    <path d="M420 33 C430 36 442 34 446 27"/>
    <path d="M578 20 C586 18 594 20 596 26 C596 32 590 35 582 34"/>
    <path d="M578 34 C586 34 592 30 594 26"/>
  </g>
  <text x="98" y="52">Human</text>
  <text x="252" y="52">Language model</text>
  <text x="414" y="52">Vision model</text>
  <text x="572" y="52">Specialist</text>

  <!-- everything routes through the same door -->
  <g fill="none" stroke="#6B5A66" stroke-width="1.5" stroke-linecap="round">
    <path d="M116 60 C124 68 132 76 150 84"/>
    <path d="M270 60 C272 70 274 76 278 84"/>
    <path d="M432 60 C430 70 428 76 424 84"/>
    <path d="M586 60 C578 68 568 76 552 84"/>
  </g>

  <!-- the runtime -->
  <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 86 C220 82.6 460 87 628 84.4"/>
    <path d="M627.6 84.8 C630 108 628.4 140 629 162"/>
    <path d="M628.6 162.6 C460 165.6 220 161.4 92 164.6"/>
