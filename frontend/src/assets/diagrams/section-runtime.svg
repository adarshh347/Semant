  <text class="hi" x="118" y="112">Inquiry state</text>
  <text class="hi" x="296" y="112">Capability routing</text>
  <text class="hi" x="476" y="112">Evidence transactions</text>
  <text class="hi" x="118" y="150">Operation grammar</text>
  <text class="hi" x="296" y="150">Conflict control</text>
  <text class="hi" x="476" y="150">Replay &amp; rehearsal</text>

  <path d="M360 166 C359 176 361 184 360 192"
