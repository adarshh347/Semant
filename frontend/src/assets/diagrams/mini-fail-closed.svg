<svg id="d-fail-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 40" width="88" height="40" role="img" aria-label="Two acts approach a gate; one passes and leaves a mark, the other stops at the boundary.">
  <title>Semant — Fail-closed</title>
  <desc>Two acts approach a gate; one passes and leaves a mark, the other stops at the boundary.</desc>
  <style>#d-fail-closed{color:#1E1A1C}</style>
  <defs>
    <filter id="dfc-b" x="-25%" y="-40%" width="150%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#A9A0A6" stroke-width="0.8" stroke-linecap="round" style="opacity:var(--guide-o, 0.16)">
    <path d="M44.2 3 V37" stroke-dasharray="1.6 2.4"/>
  </g>
  <g style="opacity:var(--wash-o, 0.16)">
    <path filter="url(#dfc-b)" fill="#657A86"
          d="M32 8 C42 5.6 54 6.6 58 9 C58.6 18 57 27 55 32 C45 34 36 33 32 31 C30.4 24 30.4 14 32 8 Z"/>
    <path filter="url(#dfc-b)" fill="#8E3F6A"
          d="M3 22 C11 20 20 21 23 23.4 C22 28 15 31 8 29.6 C3 28.4 2 24 3 22 Z"/>
  </g>
  <!-- the gate -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35.6 7.6 C32.6 7.4 31.4 8.8 31.6 11 C32 15.4 31.6 24.6 31.8 28.6 C32 30.8 33.2 32 35.4 31.6"/>
    <path d="M53.4 7.4 C56.4 7.3 57.6 8.6 57.4 10.8 C57 15.2 57.4 24.4 57.2 28.4 C57 30.6 55.8 31.8 53.6 31.4"/>
    <!-- the act that runs -->
    <path d="M4.4 15.4 C16 14.4 34 16 52 14.8"/>
    <!-- the act that does not -->
    <path d="M4.6 26.4 C12 25.8 20 26.6 27.6 26"/>
  </g>
  <!-- the closed boundary -->
  <path d="M29.4 22.6 V29.8"
        fill="none" stroke="#6B5A66" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="60.6" cy="14.6" r="3.5" fill="currentColor"/>
  <path d="M63.2 12.1 C65.2 10.1 66.4 8.9 68 7.3"
        fill="none" stroke="var(--tick, #7B2D6B)" stroke-width="2.2" stroke-linecap="round"/>
</svg>
