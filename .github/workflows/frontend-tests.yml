name: frontend

# Runs the Vitest suite on every PR into main or atlas/integration, and on pushes
# to either. The `test` job is wired in as a required status check on main (branch
# protection), so a red suite blocks the merge button.
#
# `atlas/integration` is here because the Atlas gates land there rather than on main
# — the integration→main merge is its own later checkpoint. Without this the whole
# Atlas programme was merging with no CI at all, and the suite was only ever green
# because it was being run by hand.
#
# `writer/integration` is here for the same reason, and it carries one test that has to
# run somewhere by contract: Semant Writer W2 enforces "orchestration never reaches the
# manuscript" (I6) in the ProseMirror schema, and
# `src/writer/schema/manuscriptExport.test.js` asserts it against the EXPORT. The W2
# directive requires that assertion to run in CI, so the writer trunk must be a trigger —
# otherwise the guard exists but nothing is watching it.
on:
  pull_request:
    branches: [main, atlas/integration, writer/integration]
  push:
    branches: [main, atlas/integration, writer/integration]

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # The pixel-honesty audit, made self-enforcing.
  #
  # `frontend/scripts/pixelHonestyMutations.mjs` breaks one honesty guarantee at a time — proposed
  # rendered as measured, a number on an incommensurable pair, a box drawn where a mask belongs, a
  # second renderer — and requires the test that claims to guard it to be the one that dies. Until
  # this job existed the harness was a checked-in guard nothing called, which is the failure this
  # project keeps finding everywhere else.
  #
  # Its OWN honesty floor is the `--all` flag: the run begins with a self-test proving the harness
  # cannot report a bite where there is none. The audit found that exact false-positive in itself —
  # five mutations passed against a suite that did not exist, because vitest exits non-zero on a
  # missing file. A harness carrying that bug into CI goes green on a DELETED suite, so the
  # self-test runs first and a broken one aborts before any result is printed.
  #
  # Separate from `test` on purpose: "the suite is red" and "the suite guards nothing" are different
  # failures and deserve different signals. This one fails when a guarantee has no biting test — so
  # a half-guard cannot land.
  honesty:
    name: honesty audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Mutates files in the checkout and restores each after; the runner is disposable either way.
      # Non-zero exit = a guarantee nothing guards, or a self-test that no longer holds.
      - name: Prove the honesty guards bite
        run: npm run audit:honesty
