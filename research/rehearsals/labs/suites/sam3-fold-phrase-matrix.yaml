  fixtures_sha256: "08f8a8ed56065792ee056f4f35f387414400153edcc585c442062d1745581ddb"

# ── the material ──────────────────────────────────────────────────────────────────────────────
# Four fixtures, all already checked in. Nothing was downloaded for this lane.
#
# ON TRADITION, AND WHY THREE OF FOUR SAY `null`. The card asks for material from at least two
# documented traditions "if existing metadata honestly supports that statement. Otherwise
# describe only what the repository provenance proves." It does not. The 003 source-notes record
# `title` null, `description` empty, no catalogue number and NO ICONOGRAPHIC IDENTIFICATION
# ATTEMPTED; the 002 collage's culture labels are noted as the plate's own captions with no
# verified attribution behind them. I can recognise what several of these depict. Recognising a
# sculpture is not the repository documenting it, and writing my recognition into a provenance
# field would manufacture exactly the sourced-looking metadata the field exists to record.
# So `documented_tradition` is null wherever the repo is silent, and what I can see goes in
# `observed`, marked as observation.
