schema_version: phrase-matrix-suite.v1
suite_id: sam3-fold-phrase-matrix
title: "SAM 3 phrase robustness: is the fold failure the wording, the picture, or the instrument?"
pre_registered_at: "2026-08-08, before any live call in this lane"

why: >
  HARNESS-001C measured, on ONE image, that `face` returned three masks while `drapery fold`,
  `folded drapery`, `folding architecture`, `sensuality` and `bicycle` returned none, and that
  `robe folds` returned a single low-confidence mask covering the garment. That is enough to
  reject "produced nothing" as one undifferentiated failure. It is not enough to say whether the
  instability belongs to the wording, to that picture, or to concept segmentation as an
  instrument for fold geometry.

  Two things make this lane necessary rather than merely wider.

  First, C1's attribution was under-determined in a way one image cannot reveal. The repository
  independently documents that the Pietà fixture CARRIES A BLENDED GRAIN/TEXTURE LAYER — a
  reproduction confound recorded in `runs/006-narrative-overreach/source-notes.md`,
  `R2/HW-L4-a5-a6-decision-memo.md` and `R2/HW-L4-next-rehearsal-directive-draft.md`, none of
  which were written for this lane. C1 concluded "the difference is carried entirely by the
  wording" from a single fixture that has a known image-condition confound sitting under every
  row of it. That conclusion was over-stated, and this suite is built to test it: the Angel of
  Grief is documented by the same notes as an UNTREATED daylight photograph with no
  post-processing layer, which makes it the control the C1 result never had.

  Second, five phrases on one picture is not a curve.

  This lane does not improve SAM, search for a phrase that happens to win, or build an organ.

actuator_lock: concept_segment
call_budget: 1

# Digests over the two things that must not move once collection begins. Computed by
# `matrix --plan`; re-checked at every --live and --report. See phrase-matrix-suite.schema.json.
