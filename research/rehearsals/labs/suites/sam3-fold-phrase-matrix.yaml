# ── the phrases, frozen ───────────────────────────────────────────────────────────────────────
# Twelve phrases in six families. Eleven are the card's own list, verbatim. One is added, before
# any live call, with its justification recorded — which is the only time anything may be added.
#
# AFTER THE FIRST LIVE CALL NOTHING HERE MAY CHANGE. Not a spelling, not a plural, and above all
# not a new synonym in response to an empty result. `lock.phrases_sha256` is what makes that a
# fact about the run rather than a promise about my conduct.
phrase_families:
  - family: availability_control
    role: availability_control
    phrases: ["face"]
    expectation: >
      The gate. `face` returned three instances on the Pietà in C1, so the instrument works on at
      least one fixture here. If it returns nothing on some fixture, NO phrase failure on that
      fixture may be attributed to the phrase — the instrument was not shown to be working there,
      and every empty below it is uninterpretable rather than informative.

  - family: object_scope
    role: object_scope
    phrases: ["robe", "garment", "drapery"]
    expectation: >
      The whole cloth object, named three ways. Separates "cannot find cloth at all" from "finds
      cloth, cannot find folds in it" — which are different capability claims and were
      indistinguishable in C1, where the only non-empty fold-adjacent phrase returned the garment.

  - family: fold_target
    role: fold_target
    phrases: ["robe folds", "drapery folds", "folded drapery", "fabric folds", "creases"]
    expectation: >
      The thing the inquiry actually wants: local fold geometry, not the garment carrying it.
      Five wordings, so a single miss is not read as a capability.

  - family: replication_control
    role: replication_control
    phrases: ["drapery fold"]
    justification: >
      Added before any live call in this lane. C1's exact phrase, kept so this suite can say
      whether its one-image result REPRODUCES rather than assuming it. It is worth its own row
      for a second reason: it differs from the frozen `drapery folds` by a single character, so
      the pair is a direct measurement of how much a plural costs — which is the lane's whole
      question in miniature. This is a replication control, not a synonym search: it was C1's
      phrase before any result here was known, and it is not permitted to grow.

  - family: adversarial_abstraction
    role: adversarial_abstraction
    phrases: ["sensuality"]
    expectation: >
      A word from the wave's prompt that names nothing a segmenter can find. Whatever it returns
      establishes nothing about any image; it probes the organ's willingness to answer an
      unanswerable question, which is the failure mode SF-004-R2 caught on a painting.

  - family: negative_control
    role: negative_control
    phrases: ["bicycle"]
    expectation: >
      The control whose PASS is an empty result. If this returns instances anywhere, every
      positive row in the matrix is weakened, because the organ is answering the prompt rather
      than the picture.

# ── the arm plan ──────────────────────────────────────────────────────────────────────────────
arms:
  full_matrix:
    mode: organ_direct
    fixtures: all
    families: all
    note: >
      12 phrases x 4 fixtures = 48 captures through the cheapest arm that retains the same organ
      call. Each is its own firewall with its own budget of one; a matrix of 48 captures is 48
      budgets of one, never one budget of 48.

  wrapper_equivalence:
    mode: actuator_direct
    fixtures: all
    phrases: ["face", "drapery"]
    note: >
      8 captures. `face` because C1 showed it is the phrase most likely to be non-empty, and an
      equivalence test on an empty result tests nothing — C1's own fold actuator run was empty
      and therefore established no wrapper property at all. `drapery` because a second,
      structurally different phrase guards against equivalence that holds only for the one case
      it was checked on. Any mismatch here is an INTEGRATION DEFECT, not an organ finding.

# ── planner stability ─────────────────────────────────────────────────────────────────────────
planner_sampling:
  samples: 5
  planning_only: true
  prompt: >-
    Explore the fold-level aesthetic and style relations between Renaissance and Buddha
    sculptures, their common way of unfolding sensuality, where they drift apart, and what hybrid
    styles they could give birth to.
  model_contract:
    role: step_planner
    model: null            # resolved from role_registry at run time and recorded per receipt
    temperature: null      # provider default; recorded per receipt, never assumed
    response_format: json_object

expected_invariants:
  invocations_per_capture: 1
  lock_held: true
  database_writes: 0
  source_mutations: 0
  replay_live_calls: 0

review:
  protocol: human_visual
  questions:
    - "For each non-empty fold-target mask: is it LOCAL FOLD GEOMETRY, or the garment as a whole?"
    - "Where the object_scope family succeeded and fold_target failed on the same fixture, does the overlay show folds that were there to be found?"
    - "Does `face` land on faces on every fixture — i.e. is the availability gate honest?"
    - "On the Angel of Grief versus the Pietà: does the untreated image behave differently from the texture-blended one for the SAME phrase?"
