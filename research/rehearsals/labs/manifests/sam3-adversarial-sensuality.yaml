schema_version: single-actuator-manifest.v1
lab_id: sam3-concept-segment
run_id: sam3-adversarial-sensuality
title: "An abstract noun, handed to a segmenter"

why: >
  `sensuality` is a word from the wave's prompt and it names nothing a segmentation model can
  find. This run exists to see WHAT HAPPENS ANYWAY, because the failure mode that matters is not
  refusal — it is a confident, well-formed mask of something, which is exactly what the SF-004-R2
  spike watched happen on a painting for `shoulder fabric`.

  Whatever it returns, this run establishes NOTHING about the image. It is not a positive control
  with a hard phrase; it is a probe of the organ's willingness to answer an unanswerable
  question, and it is marked `adversarial` so no reader can mistake a returned mask for a
  finding about sensuality.

actuator_lock: concept_segment
mode: organ_direct
call_budget: 1

image:
  source: local_fixture
  path: research/rehearsals/fixtures/002F-pieta-single-object/pieta-in-situ.jpg
  sha256: 8882d66ff3f9f4c16e13406039ed1412d21fcbad43fc6bb917120ad1f8c0cfe4

prompt: null
control_phrase: "sensuality"
allowed_params: ["phrase"]

model_expectation:
  checkpoint: facebook/sam3
  preprocessing_version: sam3-pcs-v1
  conf: 0.25
  imgsz: 1024
  max_instances: 16

warm_or_cold: warm
repeat_count: 1

expected_condition: adversarial

review:
  protocol: human_visual
  gold_mask_path: null
  questions:
    - "Did it refuse (empty), or did it mask something?"
    - "If it masked something, WHAT — and at what naming confidence?"
    - "Would that mask have survived the 0.50 naming floor and reached a curator as a reading?"

pair_with: null
